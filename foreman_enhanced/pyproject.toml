[project]
name = "foreman-enhanced"
version = "0.2.0"
description = "Agent-assisted Scrum Master workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
  "streamlit>=1.38",
  "crewai>=0.80",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "requests>=2.32",
  "networkx>=3.3",
  "scikit-learn>=1.5",
  "pyyaml>=6.0"
]

[project.scripts]
foreman = "scrummaster_businessanalyst_multiagent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrummaster_businessanalyst_multiagent"]
